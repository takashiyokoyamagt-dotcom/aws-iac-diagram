# 開発用の環境（単体テスト・fixture の検証）。`uv run python -m unittest discover -s tests -v` で使う。
# SKILL のスクリプトはこの環境を使わず、各スクリプト先頭の PEP 723 の宣言だけで `uv run` から動く。
# 版はスクリプト側の宣言と揃えること。
[project]
name = "aws-iac-diagram-dev"
version = "0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "python-hcl2==8.1.4",
    "defusedxml==0.7.1",  # まだどのスクリプトも使っていない（.drawio の読み込みに使う予定）
    "PyYAML==6.0.3",
    "Pillow==12.3.0",
    "jsonschema==4.26.0",
    "cfn-lint==1.57.2",
]

[dependency-groups]
# 既定の環境（`uv sync`・CI の `uv sync --locked`・`uv run`）には入れない。plan JSON の fixture を作り直すときだけ、
# `uv run --group fixtures python aws-iac-diagram-workspace/tools/make_plan_json.py` のように足す（ローカルの AWS モック。
# テストと CI は使わない）。
fixtures = [
    "moto[server]==5.2.4",
]

[tool.uv]
package = false
