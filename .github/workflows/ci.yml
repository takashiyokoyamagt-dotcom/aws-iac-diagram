# Windows と Ubuntu の両方で、単体テスト・fixture の検証と、SKILL のスクリプトを uv から起動する確認を行う。
# Windows では利用者と同じ Windows PowerShell 5.1 から、日本語とスペースを含むパスに置いた SKILL を起動する。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"

      - name: 開発用の環境を作る
        run: uv sync --locked

      - name: 単体テスト
        run: uv run python -m unittest discover -s tests -v

      - name: 正解 IR と fixture の検証
        shell: bash
        run: |
          uv run python skills/aws-iac-diagram/scripts/validate_ir.py aws-iac-diagram-workspace/expected/*.ir.json
          uv run python aws-iac-diagram-workspace/tools/check_coverage.py --lint
          # C1（CRITERIA の 1.6）: cfn-lint のグラフの辺のすべてに、CFN アダプタの raw IR の参照が対応する
          uv run python aws-iac-diagram-workspace/tools/c1_check.py

      # 以下は SKILL を使う側と同じ起動のしかた（リポジトリの外に置き、PEP 723 の宣言だけで uv run する）
      - name: SKILL の起動（Windows PowerShell 5.1、日本語とスペースを含むパス）
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # PowerShell 5.1 は BOM の無いスクリプトを ANSI として読むので、コード（文字列）は ASCII だけで書く。
          # 「日本語 パス」は文字コードから組み立てる（コメントは日本語でよい）
          $jp = -join ([char[]](0x65E5, 0x672C, 0x8A9E, 0x20, 0x30D1, 0x30B9))
          $base = Join-Path $env:RUNNER_TEMP $jp
          $skill = Join-Path $base 'aws-iac-diagram'
          New-Item -ItemType Directory -Force $base | Out-Null
          Copy-Item -Recurse 'skills\aws-iac-diagram' $skill
          Copy-Item 'aws-iac-diagram-workspace\expected\three-tier.ir.json' $base
          Set-Location $base
          $out = Join-Path $base 'out\doctor.json'
          uv run "$skill\scripts\doctor.py" --out "$out"
          $code = $LASTEXITCODE
          # draw.io と mmdc はランナーに無いので 1（warn）になる
          if ($code -ne 0 -and $code -ne 1) { throw "doctor exit code was $code" }
          $report = [IO.File]::ReadAllText($out, [Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($report.skill.missing_files.Count -ne 0) { throw "SKILL files are missing" }
          if ($report.skill.dir -ne $skill) { throw "unexpected SKILL dir: $($report.skill.dir)" }
          Write-Host "doctor: $($report.status) (exit $code)"
          # PEP 723 の依存（jsonschema）を uv が入れる経路も、日本語のパスで通す
          uv run "$skill\scripts\validate_ir.py" "$base\three-tier.ir.json"
          if ($LASTEXITCODE -ne 0) { throw "validate_ir exit code was $LASTEXITCODE" }
          exit 0

      - name: SKILL の起動（bash、日本語とスペースを含むパス）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          base="$RUNNER_TEMP/日本語 パス"
          mkdir -p "$base"
          cp -R skills/aws-iac-diagram "$base/aws-iac-diagram"
          cd "$base"
          set +e
          uv run "$base/aws-iac-diagram/scripts/doctor.py" --out "$base/out/doctor.json"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then echo "doctor の終了コードが $code でした"; exit 1; fi
          uv run --no-project python -c "import json,sys; r=json.load(open(sys.argv[1],encoding='utf-8')); assert not r['skill']['missing_files'], r; print('doctor:', r['status'])" "$base/out/doctor.json"
          cp "$GITHUB_WORKSPACE/aws-iac-diagram-workspace/expected/three-tier.ir.json" "$base/"
          uv run "$base/aws-iac-diagram/scripts/validate_ir.py" "$base/three-tier.ir.json"
