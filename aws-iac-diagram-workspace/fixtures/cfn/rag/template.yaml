AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Fixture rag. S3 documents -> Bedrock Knowledge Base (OpenSearch Serverless vector store),
  REST API -> Lambda -> RetrieveAndGenerate, and S3 put -> Lambda -> StartIngestionJob.
  Same architecture as fixtures/tf/rag.

Parameters:
  Project:
    Type: String
    Default: rag
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  GenerationModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0

Resources:
  # ---------------------------------------------------------------- S3
  DocsBucket:
    Type: AWS::S3::Bucket
    DependsOn: IngestS3Permission
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${Project}-docs"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # TF 版の aws_s3_bucket_notification に当たる（インライン）
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt IngestFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: docs/

  # ---------------------------------------------------------------- OpenSearch Serverless
  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${Project}-kb"
      Type: encryption
      Policy: !Sub '{"Rules":[{"ResourceType":"collection","Resource":["collection/${Project}-kb"]}],"AWSOwnedKey":true}'

  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${Project}-kb"
      Type: network
      Policy: !Sub '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${Project}-kb"]}],"AllowFromPublic":true}]'

  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${Project}-kb"
      Type: data
      Policy: !Sub >-
        [{"Rules":[
        {"ResourceType":"index","Resource":["index/${Project}-kb/*"],"Permission":["aoss:CreateIndex","aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument","aoss:UpdateIndex","aoss:DeleteIndex"]},
        {"ResourceType":"collection","Resource":["collection/${Project}-kb"],"Permission":["aoss:CreateCollectionItems","aoss:DescribeCollectionItems","aoss:UpdateCollectionItems"]}],
        "Principal":["${KnowledgeBaseRole.Arn}","arn:${AWS::Partition}:iam::${AWS::AccountId}:root"]}]

  Collection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn: [EncryptionPolicy, NetworkPolicy, DataAccessPolicy]
    Properties:
      Name: !Sub "${Project}-kb"
      Type: VECTORSEARCH

  VectorIndex:
    Type: AWS::OpenSearchServerless::Index
    Properties:
      CollectionEndpoint: !GetAtt Collection.CollectionEndpoint
      IndexName: !Sub "${Project}-index"
      Settings:
        Index:
          Knn: true
          KnnAlgoParamEfSearch: 512
      Mappings:
        Properties:
          embedding:
            Type: knn_vector
            Dimension: 1024
            Method:
              Name: hnsw
              Engine: faiss
              SpaceType: l2
          text:
            Type: text
          metadata:
            Type: text
            Index: false

  # ---------------------------------------------------------------- Bedrock Knowledge Base
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-kb"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: knowledge-base
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadDocs
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${Project}-docs"
                  - !Sub "arn:${AWS::Partition}:s3:::${Project}-docs/*"
              - Sid: VectorStore
                Effect: Allow
                Action: aoss:APIAccessAll
                Resource: !Sub "arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*"
              - Sid: Embedding
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: VectorIndex
    Properties:
      Name: !Sub "${Project}-kb"
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
      StorageConfiguration:
        Type: OPENSEARCH_SERVERLESS
        OpensearchServerlessConfiguration:
          CollectionArn: !GetAtt Collection.Arn
          VectorIndexName: !Sub "${Project}-index"
          FieldMapping:
            VectorField: embedding
            TextField: text
            MetadataField: metadata

  DocsDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: !Sub "${Project}-docs"
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt DocsBucket.Arn
          InclusionPrefixes: [docs/]

  # ---------------------------------------------------------------- ingest
  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Project}-ingest"
      RetentionInDays: 14

  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-ingest"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: ingest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:StartIngestionJob
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"

  # DocsDataSource を参照すると DocsBucket（通知）→ IngestFunction → DocsDataSource → DocsBucket と循環するので、
  # 環境変数では KB だけを直接参照し、データソース ID は実行時に引く（TF 版は DATA_SOURCE_ID も参照している）。
  IngestFunction:
    Type: AWS::Lambda::Function
    DependsOn: IngestLogGroup
    Properties:
      FunctionName: !Sub "${Project}-ingest"
      Role: !GetAtt IngestRole.Arn
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBase
      Code:
        ZipFile: |
          import os
          import boto3
          AGENT = boto3.client("bedrock-agent")
          def handler(event, context):
              kb = os.environ["KNOWLEDGE_BASE_ID"]
              ds = AGENT.list_data_sources(knowledgeBaseId=kb)["dataSourceSummaries"][0]["dataSourceId"]
              AGENT.start_ingestion_job(knowledgeBaseId=kb, dataSourceId=ds)

  IngestS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      # バケットを参照すると循環するので ARN を文字列で組み立てる（よくある書き方）
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${Project}-docs"

  # ---------------------------------------------------------------- query
  QueryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Project}-query"
      RetentionInDays: 14

  QueryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-query"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: query
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Retrieve
                Effect: Allow
                Action: [bedrock:Retrieve, bedrock:RetrieveAndGenerate]
                Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
              - Sid: Generate
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${GenerationModelId}"

  QueryFunction:
    Type: AWS::Lambda::Function
    DependsOn: QueryLogGroup
    Properties:
      FunctionName: !Sub "${Project}-query"
      Role: !GetAtt QueryRole.Arn
      Runtime: python3.13
      Handler: index.handler
      Timeout: 60
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBase
          MODEL_ARN: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${GenerationModelId}"
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          RUNTIME = boto3.client("bedrock-agent-runtime")
          def handler(event, context):
              question = json.loads(event.get("body") or "{}").get("question", "")
              resp = RUNTIME.retrieve_and_generate(
                  input={"text": question},
                  retrieveAndGenerateConfiguration={
                      "type": "KNOWLEDGE_BASE",
                      "knowledgeBaseConfiguration": {
                          "knowledgeBaseId": os.environ["KNOWLEDGE_BASE_ID"],
                          "modelArn": os.environ["MODEL_ARN"],
                      },
                  },
              )
              return {"statusCode": 200, "body": json.dumps({"answer": resp["output"]["text"]})}

  # ---------------------------------------------------------------- REST API
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${Project}-api"
      EndpointConfiguration:
        Types: [REGIONAL]

  QueryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: query

  # TF 版の aws_api_gateway_method と aws_api_gateway_integration を1つにしたもの
  QueryPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref QueryResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${QueryFunction.Arn}/invocations"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: QueryPostMethod
    Properties:
      RestApiId: !Ref RestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  ApiInvokeQueryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QueryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/query"

Outputs:
  ApiUrl:
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/query"
