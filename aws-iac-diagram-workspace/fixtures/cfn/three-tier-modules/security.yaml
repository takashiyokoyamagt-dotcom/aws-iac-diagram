AWSTemplateFormatVersion: "2010-09-09"
Description: three-tier-modules / security groups for the app and the database.

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  AppPort:
    Type: Number

Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-app"
      GroupDescription: ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  AppFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt AppSecurityGroup.GroupId
      SourceSecurityGroupId: !Ref AlbSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      Description: App port from ALB

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-db"
      GroupDescription: RDS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: PostgreSQL from app
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt AppSecurityGroup.GroupId

Outputs:
  AppSecurityGroupId:
    Value: !GetAtt AppSecurityGroup.GroupId
  DbSecurityGroupId:
    Value: !GetAtt DbSecurityGroup.GroupId
